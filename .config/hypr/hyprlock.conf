# hyprlock - coolors palette: 0C1434 F0B08E 0B0512 ED895B 304976

$font = FiraCode Nerd Font Mono

general {
    hide_cursor = false
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
        retry_delay = 250 # in milliseconds
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/1331861.png
    blur_passes = 3
}

# light palette tint over the wallpaper
shape {
    monitor =
    size = 100%, 100%
    color = rgba(0b051255)
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME12
    color = rgba(f0b08eff)
    font_size = 96
    font_family = $font

    position = 0, 190
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    color = rgba(f0b08ecc)
    font_size = 28
    font_family = $font

    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 25%, 5%
    outline_thickness = 3
    inner_color = rgba(0c1434aa) # no fill

    outer_color = rgba(304976ee) rgba(ed895bee) 45deg
    check_color = rgba(f0b08eee) rgba(ed895bee) 120deg
    fail_color = rgba(ed895bee) rgba(f0b08eee) 40deg

    font_color = rgb(240, 176, 142)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Enter password...
    fail_text = $PAMFAIL$FPRINTFAIL

    dots_spacing = 0.3

    position = 0, 0
    halign = center
    valign = center
}

# KEYBOARD LAYOUT
label {
    monitor =
    text = $LAYOUT[en,ara]
    color = rgba(f0b08eff)
    font_size = 26
    font_family = $font
    onclick = hyprctl switchxkblayout all next

    position = 0, 290
    halign = center
    valign = center
}
