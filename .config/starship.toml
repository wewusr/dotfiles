command_timeout = 3000

# Palette:
# BG: #222436 (Dark Moon)
# Username: #3b4261
# Directory: #82aaff (Soft Blue)
# Git: #ff966c (Orange)
# Internet: #c8d3f5
# Status/Error: #ff757f (Red-Pink)
# #4fd6be
# #2d3f76
# #1e2030
# #bb9af7

format = """
[█](#3b4261)\
$os\
$username\
$sudo\
[](bg:#82aaff fg:#3b4261)\
$directory\
[](fg:#82aaff bg:#ff966c)\
$git_branch\
$git_status\
[](fg:#ff966c bg:#c8d3f5)\
${custom.internet}\
[](fg:#c8d3f5 bg:#4fd6be)\
$python\
$c\
$rust\
$golang\
[](fg:#4fd6be bg:#2d3f76)\
$cmd_duration\
[](fg:#2d3f76 bg:#1e2030)\
$time\
[](fg:#1e2030 bg:#bb9af7)\
$status\
[](fg:#bb9af7)\n\
$character
"""

add_newline = true

[username]
show_always = true
style_user = "bg:#3b4261 fg:#c8d3f5 bold"
style_root = "bg:#3b4261 fg:#ff757f bold"
format = '[ $user ]($style)'

[os]
style = "bg:#3b4261 fg:#c8d3f5"
disabled = false

[os.symbols]
Linux = " "

[sudo]
format = '[$symbol]($style)'
style = 'bg:#3b4261 fg:#ffc777'
symbol = ' '
disabled = false

[directory]
style = "bg:#82aaff fg:#1e2030 bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:#ff966c fg:#1e2030 bold"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#ff966c fg:#1e2030"
format = '[$all_status$ahead_behind ]($style)'

[custom.internet]
command = "ping -c 1 8.8.8.8 > /dev/null 2>&1 && echo '  ' || echo ' 󱛅 '"
when = "true"
style = "bg:#c8d3f5 fg:#1e2030"
format = '[ $output ]($style)'

[python]
symbol = " "
style = "bg:#4fd6be fg:#1e2030"
format = '[ $symbol$version ]($style)'

[c]
symbol = " "
style = "bg:#4fd6be fg:#1e2030"
format = '[ $symbol$version ]($style)'

[rust]
symbol = " "
style = "bg:#4fd6be fg:#1e2030"
format = '[ $symbol$version ]($style)'

[cmd_duration]
min_time = 2_000
style = "bg:#2d3f76 fg:#c8d3f5"
format = "[ 󰔟 $duration ]($style)"

[time]
disabled = false
time_format = "%r"
style = "bg:#1e2030 fg:#c8d3f5"
format = '[ $time ]($style)'

[status]
disabled = false
format = '[ code: $int ]($style)'
style = "bg:#bb9af7 fg:#1e2030 bold"
success_symbol = ""

[character]
success_symbol = "[](#82aaff)"
error_symbol = "[](#bb9af7)"
vimcmd_symbol = "[](#4fd6be)"
